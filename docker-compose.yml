services:
  db:
    build:
      context: ./docker/db
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: wheelcheck-db
    environment:
      POSTGRES_DB: wheelcheck
      POSTGRES_USER: wheelcheck
      POSTGRES_PASSWORD: wheelcheck_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wheelcheck"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wheelcheck-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/wheelcheck
      SPRING_DATASOURCE_USERNAME: wheelcheck
      SPRING_DATASOURCE_PASSWORD: wheelcheck_dev
      JWT_SECRET: dev-secret-change-in-production
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wheelcheck-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_MAP_TILE_URL: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    ports:
      - "3000:3000"
    depends_on:
      - backend

  adminer:
    image: adminer
    container_name: wheelcheck-adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  pgdata:
