name: Keep HF Space Alive

on:
  schedule:
    # Run once every 24 hours at 8:00 UTC (4:00 PM MYT)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allow manual trigger

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HuggingFace Space
        run: |
          echo "Pinging WheelCheck API..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 120 \
            https://sirhafizho-wheelcheck-api.hf.space/api/places?page=0\&size=1)
          echo "Response status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
            echo "✅ Space is alive"
          else
            echo "⚠️ Space returned $STATUS — it may be waking up"
          fi
