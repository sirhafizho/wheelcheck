name: Database Backup

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:       # Manual trigger

permissions:
  contents: read

jobs:
  backup:
    name: Backup Supabase DB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Create backup
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_FILE="wheelcheck_backup_${TIMESTAMP}.sql"

          # Dump schema + data (exclude Supabase internal schemas)
          pg_dump "$DATABASE_URL" \
            --no-owner \
            --no-privileges \
            --exclude-schema='auth' \
            --exclude-schema='storage' \
            --exclude-schema='realtime' \
            --exclude-schema='supabase_*' \
            --exclude-schema='extensions' \
            --exclude-schema='_analytics' \
            --exclude-schema='_realtime' \
            --exclude-schema='graphql*' \
            --exclude-schema='pgsodium*' \
            --exclude-schema='vault' \
            --exclude-table='flyway_schema_history' \
            -f "$BACKUP_FILE"

          echo "Backup created: $BACKUP_FILE ($(wc -c < $BACKUP_FILE) bytes)"

          # Compress
          gzip "$BACKUP_FILE"
          echo "Compressed: ${BACKUP_FILE}.gz ($(wc -c < ${BACKUP_FILE}.gz) bytes)"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: wheelcheck_backup_*.sql.gz
          retention-days: 30
