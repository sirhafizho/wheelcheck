spring:
  application:
    name: wheelcheck
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wheelcheck}
    username: ${DATABASE_USERNAME:wheelcheck}
    password: ${DATABASE_PASSWORD:wheelcheck_dev}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-minimum-32-chars}
    expiration: 86400
  upload:
    directory: ${UPLOAD_DIRECTORY:uploads}

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Aggregation adapters configuration
wheelcheck:
  uploads:
    dir: ${UPLOAD_DIRECTORY:uploads}
  adapters:
    osm:
      enabled: true
      overpass-url: https://overpass-api.de/api/interpreter
    accessibility-cloud:
      enabled: false
      app-token: ${ACCESSIBILITY_CLOUD_TOKEN:}
      base-url: https://accessibility-cloud-v2.freetls.fastly.net
    wikidata:
      enabled: false
      endpoint: https://query.wikidata.org/sparql
