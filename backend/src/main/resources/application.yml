spring:
  application:
    name: wheelcheck
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wheelcheck}
    username: ${DATABASE_USERNAME:wheelcheck}
    password: ${DATABASE_PASSWORD:wheelcheck_dev}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-minimum-32-chars}
    expiration: 86400
  upload:
    directory: ${UPLOAD_DIRECTORY:uploads}

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Aggregation adapters configuration
wheelcheck:
  uploads:
    dir: ${UPLOAD_DIRECTORY:uploads}
  adapters:
    osm:
      enabled: true
      overpass-url: https://overpass-api.de/api/interpreter
    accessibility-cloud:
      enabled: false
      app-token: ${ACCESSIBILITY_CLOUD_TOKEN:}
      base-url: https://accessibility-cloud-v2.freetls.fastly.net
    wikidata:
      enabled: false
      endpoint: https://query.wikidata.org/sparql
    prasarana:
      enabled: false
      base-url: https://api.data.gov.my/gtfs-static/prasarana
      # All known Prasarana / data.gov.my GTFS feeds:
      #   rapid-rail-kl       — LRT/MRT/Monorail (Klang Valley)
      #   rapid-bus-kl        — Rapid KL bus (Klang Valley)
      #   rapid-bus-mrtfeeder — MRT feeder buses
      #   rapid-bus-sbk       — Rapid KL South bus (Subang/Klang)
      #   rapid-bus-penang    — Rapid Penang bus
      categories: rapid-rail-kl,rapid-bus-kl,rapid-bus-mrtfeeder,rapid-bus-sbk,rapid-bus-penang
    data-gov-my:
      enabled: true
      base-url: https://api.data.gov.my
      page-size: 1000
    geoapify:
      enabled: false
      api-key: ${GEOAPIFY_API_KEY:}
      base-url: https://api.geoapify.com/v2/places
      limit: 500
    ors:
      enabled: false
      api-key: ${ORS_API_KEY:}
      base-url: https://api.openrouteservice.org/v2
